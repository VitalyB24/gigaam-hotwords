# Metadata and tool configuration. g2h.py is a single script, not an installable package: it runs in the GigaAM
# virtual environment described in README.md, installed as shown there. The dependencies below list that environment's
# runtime packages for GitHub's dependency graph, so security alerts cover torch and torchaudio too; the torch pins
# repeat constraints.txt, and a test keeps the two in step. The development tools are declared in requirements-dev.txt
# (with the versions the tests are actually run against) and nowhere else, so the two cannot drift apart.
[project]
name = "gigaam-hotwords"
version = "1.0.0"
description = "Russian speech to text on a CPU with GigaAM v3 CTC and a term dictionary: VAD chunking, CTC prefix beam search with a term bonus"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Vitali Butkevich" }]
dependencies = [
    "torch==2.10.*",
    "torchaudio==2.10.*",
    "sentencepiece>=0.2.2,<0.3",
    "numpy>=2.5.3,<3",
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
# F/E9 correctness, B bugbear, PERF performance.
select = ["F", "E9", "B", "PERF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
