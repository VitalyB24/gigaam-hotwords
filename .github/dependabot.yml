# Dependabot opens a pull request when a dependency moves past the ranges in requirements-dev.txt, and CI runs on
# that pull request. Both ecosystems are watched: the Python tools, and the actions, which can silently stay on a
# Node version the runners no longer ship. Monthly and grouped: one pull request to look at, not five; security
# updates ignore the schedule.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      python-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
